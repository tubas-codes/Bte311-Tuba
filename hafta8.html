<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hafta 8 - Lab Görevi 2 (Bağlantılı PNG Renk Kartları)</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #E6E6FA; /* Lavanta arka plan */
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      background-color: #9370DB;
    }

    .navbar-brand {
      color: white;
      font-weight: bold;
    }

    .card {
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
      background-color: white;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .card-body {
      padding: 15px;
    }

    .color-name {
      font-weight: bold;
      color: #4B0082;
      margin-bottom: 0;
    }

    .color-code {
      color: #555;
      font-size: 0.9em;
    }

    img {
      border-radius: 15px 15px 0 0;
      height: 100px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Hafta 8 - Renk Bilgi Kartları</a>
    </div>
  </nav>

            <p class="color-name">Lavanta</p>
            <p class="color-code">#E6E6FA</p>

        </div>
      </div>
