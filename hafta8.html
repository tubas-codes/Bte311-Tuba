<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hafta 8 - Lab Görevi 2 (Renk Bilgi Kartları)</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #E6E6FA; /* lavanta arka plan */
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      background-color: #9370DB;
    }

    .navbar-brand {
      color: white;
      font-weight: bold;
    }

    .card {
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
      background-color: white;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .color-box {
      width: 100%;
      height: 100px;
      border-radius: 10px 10px 0 0;
    }

    .card-body {
      padding: 15px;
    }

    .color-name {
      font-weight: bold;
      color: #4B0082;
    }

    .color-code {
      color: #555;
      font-size: 0.9em;
    }
  </style>
</head>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">

      <a class="navbar-brand" href="#">Hafta 8 - Renk Bilgi Kartları</a>
    </div>
