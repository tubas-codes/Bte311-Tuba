<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hava Durumu Uygulaması</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #3a4a7a;
        }

        /* Rastgele hava durumu kutusu */
        .random-kutu {
            background: white;
            display: inline-block;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .random-kutu img {
            width: 150px;
        }

        /* Alt kutular */
        .alt-kutular {
            display: flex;
            justify-content: center; /* Ortala */
            gap: 15px; /* Kutular arası boşluk */
        }

        .kutu {
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .kutu img {
            width: 120px;
        }

        button {
            padding: 5px 10px;
            margin: 3px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #3a4a7a;
            color: white;
        }

        button:hover {
            background-color: #2c3a63;
        }
    </style>
</head>
<body>

<h1>Hava Durumu Gösterimi</h1>

<!-- Rastgele Hava Durumu -->
<div class="random-kutu">
    <h3>Bugünün Rastgele Hava Durumu</h3>
    <img id="randomImage">
</div>

<!-- Alt kutular -->
<div class="alt-kutular">
    <div class="kutu">
        <img id="hava1" src="https://cdn-icons-png.flaticon.com/512/869/869869.png">
        <br>
        <button onclick="show('hava1')">Göster</button>
        <button onclick="hide('hava1')">Gizle</button>
    </div>

    <div class="kutu">
        <img id="hava2" src="https://cdn-icons-png.flaticon.com/512/414/414825.png">
        <br>
        <button onclick="show('hava2')">Göster</button>
        <button onclick="hide('hava2')">Gizle</button>
    </div>

    <div class="kutu">
        <img id="hava3" src="https://cdn-icons-png.flaticon.com/512/4150/4150897.png">
        <br>
        <button onclick="show('hava3')">Göster</button>
        <button onclick="hide('hava3')">Gizle</button>
    </div>
</div>

<script>
    // Rastgele arka plan rengi
    const renkler = ["#f0f4ff", "#eaf7ff", "#fff0fa", "#f8f5ff", "#f9fff2"];
    document.body.style.backgroundColor = renkler[Math.floor(Math.random() * renkler.length)];

    // Rastgele hava durumu resmi
    const resimler = [
        "https://cdn-icons-png.flaticon.com/512/869/869869.png",
        "https://cdn-icons-png.flaticon.com/512/414/414825.png",
        "https://cdn-icons-png.flaticon.com/512/1163/1163624.png",
        "https://cdn-icons-png.flaticon.com/512/1146/1146869.png",
        "https://cdn-icons-png.flaticon.com/512/642/642102.png",
        "https://cdn-icons-png.flaticon.com/512/4150/4150897.png"
    ];
    document.getElementById("randomImage").src = resimler[Math.floor(Math.random() * resimler.length)];

    // Göster ve gizle fonksiyonları
    function show(id) {
        document.getElementById(id).style.display = "block";
    }
    function hide(id) {
        document.getElementById(id).style.display = "none";
    }
</script>

</body>
</html>
