<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Üyelik Formu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    h2 {
      color: purple;
    }
    label {
      font-weight: bold;
    }
    input, select {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Üyelik Formu</h2>
  <form action="" method="post">

    <label for="ad">Adınız:</label><br>
    <input type="text" id="ad" name="ad" required><br>

    <label for="soyad">Soyadınız:</label><br>
    <input type="text" id="soyad" name="soyad" required><br>

    <label for="email">E-posta:</label><br>
    <input type="email" id="email" name="email" required><br>

    <label for="sifre">Şifre:</label><br>
    <input type="password" id="sifre" name="sifre" required><br>

    <label for="dogum">Doğum Tarihi:</label><br>
    <input type="date" id="dogum" name="dogum"><br>

    <label for="cinsiyet">Cinsiyet:</label><br>
    <input type="radio" name="cinsiyet" value="Kadın"> Kadın
    <input type="radio" name="cinsiyet" value="Erkek"> Erkek<br><br>

    <label>Hobileriniz:</label><br>
    <input type="checkbox" name="hobi" value="Müzik"> Müzik
    <input type="checkbox" name="hobi" value="Spor"> Spor
    <input type="checkbox" name="hobi" value="Kitap"> Kitap<br><br>

    <label for="sehir">Şehir:</label><br>
    <select id="sehir" name="sehir">
      <option value="Ankara">Ankara</option>
      <option value="İstanbul">İstanbul</option>
      <option value="İzmir">İzmir</option>
    </select><br><br>

    <input type="submit" value="Kaydol">
  </form>
</body>
</html>
