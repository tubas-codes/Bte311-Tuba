<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kediyi Yakala!</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap");

    * { box-sizing: border-box; }
    body{
      margin:0;
      padding:20px;
      font-family:"Poppins",sans-serif;
      text-align:center;
      background: linear-gradient(135deg,#d8c3ff 0%,#e6e6fa 100%);
      min-height:100vh;
      color:#2e2546;
    }

    h1{
      margin:8px 0 10px;
      font-size:42px;
      color:#4b0082;
    }

    h2{
      margin:6px 0 14px;
      font-size:24px;
      color:#4b0082;
    }

    .score{
      padding:6px 12px;
      background:#efe6ff;
      border-radius:10px;
      color:#4b0082;
      display:inline-block;
      min-width:40px;
    }

    #start{
      background:#7b68ee;
      color:#fff;
      border:0;
      padding:10px 20px;
      font-size:18px;
      border-radius:8px;
      cursor:pointer;
      margin:12px;
    }

    #start:active{ transform: translateY(1px); }

    .game{
      width:720px;
      max-width:94%;
      margin:24px auto;
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      justify-content:center;
    }

    .hole{
      width:220px;
      height:160px;
      flex:1 1 30%;
      position:relative;
      overflow:hidden;
      border-radius:16px;
      background: #7fb285;
      box-shadow: 0 6px 14px rgba(43,40,63,0.12);
      cursor:pointer;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding-bottom:6px;
    }

    /* Kedi PNG */
    .mole{
      position:absolute;
      top:100%;
      left:50%;
      transform:translate(-50%,0);
      width:70%;
      height:70%;
      background: url("https://cdn-icons-png.flaticon.com/512/616/616430.png") center/contain no-repeat;
      transition: top 0.35s ease;
      z-index:3;
    }

    /* Yukarı çıkma */
    .hole.up .mole{
      top:8%;
    }

    @media (max-width:720px){
      .hole{ width:48%; flex-basis:48%; height:150px; }
      .mole{ width:62%; height:62%; }
    }
    @media (max-width:420px){
      .hole{ width:100%; flex-basis:100%; }
      h1{ font-size:30px; }
    }

    .pop {
      transform: scale(0.92);
      transition: transform 120ms;
    }
  </style>
</head>
<body>

  <h1>Kediyi Yakala!</h1>
  <h2>Puan: <span class="score">0</span></h2>

  <button id="start">Başla</button>

  <div class="game">
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
    <div class="hole"><div class="mole"></div></div>
  </div>

  <script>
    const holes = document.querySelectorAll('.hole');
    const moles = document.querySelectorAll('.mole');
    const scoreSpan = document.querySelector('.score');
    const startBtn = document.getElementById('start');

    let lastHole;
    let timeUp = false;
    let score = 0;
    let gameTimer = null;

    function randomTime(min, max){
      return Math.round(Math.random() * (max - min) + min);
    }

    function randomHole(holes){
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) return randomHole(holes);
      lastHole = hole;
      return hole;
    }

    function peep(){
      const time = randomTime(350, 1200);
      const hole = randomHole(holes);
      hole.classList.add('up');

      setTimeout(() => {
        hole.classList.remove('up');
        if (!timeUp) peep();
      }, time);
    }

    function startGame(){
      score = 0;
      scoreSpan.textContent = score;
      timeUp = false;
      startBtn.style.visibility = 'hidden';

      peep();

      clearTimeout(gameTimer);
      gameTimer = setTimeout(() => {
        timeUp = true;
        startBtn.textContent = 'Tekrar Dene';
        startBtn.style.visibility = 'visible';
      }, 15000);
    }

    function bonk(e){
      if (!e.isTrusted) return;

      const mole = e.currentTarget;
      const hole = mole.parentElement;

      if (!hole.classList.contains('up')) return;

      mole.classList.add('pop');
      setTimeout(() => mole.classList.remove('pop'), 120);

      score++;
      scoreSpan.textContent = score;

      hole.classList.remove('up');
    }

    moles.forEach(m => m.addEventListener('click', bonk));
    startBtn.addEventListener('click', startGame);
  </script>

</body>
</html>
